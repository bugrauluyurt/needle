services:
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      NEEDLE_DOMAIN: ${NEEDLE_DOMAIN:?set NEEDLE_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [needle]
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
