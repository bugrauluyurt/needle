name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: YouTube Music bridge lint
        run: uv run --locked --project bridges/youtube-music ruff check bridges/youtube-music

      - name: YouTube Music bridge format
        run: uv run --locked --project bridges/youtube-music ruff format --check bridges/youtube-music

      - name: YouTube Music bridge tests
        run: uv run --locked --project bridges/youtube-music python -m unittest discover -s bridges/youtube-music/test -p 'test_*.py'

      - name: Changelog entries
        run: python3 scripts/changelog.py next package.json

  e2e:
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium webkit

      - name: Install media fixture dependencies
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - run: pnpm build

      - run: pnpm e2e

      - name: Print container logs after failure
        if: failure()
        run: docker compose -f e2e/compose.yml logs
