name: needle-test
services:
  navidrome:
    image: deluan/navidrome@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
    user: "${UID:-1000}:${GID:-1000}"
    # Host networking lets Navidrome reach the ListenBrainz mock, which host firewalls block from containers.
    network_mode: host
    environment:
      ND_ADDRESS: 127.0.0.1
      ND_PORT: "14533"
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_DEVAUTOCREATEADMINPASSWORD: needle-test
      ND_SCANSCHEDULE: "0"
      ND_SCANNER_PURGEMISSING: always
      ND_AGENTS: ""
      ND_LASTFM_ENABLED: "false"
      ND_ENABLEINSIGHTSCOLLECTOR: "false"
      ND_LOGLEVEL: warn
      ND_LISTENBRAINZ_BASEURL: http://127.0.0.1:14538/lb/1/
    volumes:
      - ./.library:/music:ro
      - ./.navidrome:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:14533/ping"]
      interval: 2s
      retries: 30
